name: tests

# Manual only: Actions > tests > Run workflow, or `gh workflow run tests.yml --ref <branch>`.
# Pushes and pull requests never start a build.
on:
  workflow_dispatch:
    inputs:
      reporter_build:
        description: Package a Windows reporter test build (no release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (windows-x86_64)
    runs-on: windows-2022
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt for reporter build
        if: inputs.reporter_build
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools
        shell: pwsh
        run: glslangValidator --version

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: .sccache
          key: tests-objects-windows-x86_64-${{ github.sha }}
          restore-keys: |
            tests-objects-windows-x86_64-

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build/tests -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DYUZU_TESTS=ON
          -DDYNARMIC_TESTS=ON
          -DENABLE_QT=${{ inputs.reporter_build && 'ON' || 'OFF' }}
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_CMD=OFF
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_WEB_SERVICE=OFF
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DENABLE_WERROR=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        shell: bash
        run: |
          cmake --build build/tests --target tests dynarmic_tests --parallel
          sccache --show-stats

      - name: Run tests
        shell: bash
        run: build/tests/bin/tests.exe --reporter console --durations yes

      - name: Run dynarmic tests
        shell: bash
        run: build/tests/bin/dynarmic_tests.exe --durations yes

      - name: Build reporter GUI
        if: inputs.reporter_build
        shell: bash
        run: cmake --build build/tests --target yuzu --parallel

      - name: Package reporter GUI
        if: inputs.reporter_build
        shell: pwsh
        run: |
          if (-not (Test-Path build/tests/bin/orchid.exe)) { throw "Missing GUI" }
          windeployqt --release --no-translations build/tests/bin/orchid.exe
          @"
          Commit: ${{ github.sha }}
          Platform: Windows x86_64 MSVC Release test build
          Extract the entire archive, then run orchid.exe.
          Keep existing headset, surround and emulator settings unchanged.
          Start Orbitals 5.0.0 and compare intro, menu and gameplay audio.
          Report which stages are audible, distortion or missing channels, and any regression.
          This build is unverified in Orbitals on real Windows hardware.
          "@ | Set-Content build/tests/bin/REPORTER-TEST.txt
          Remove-Item build/tests/bin/*tests*.exe -ErrorAction SilentlyContinue

      - name: Upload reporter build
        if: inputs.reporter_build
        uses: actions/upload-artifact@v7
        with:
          name: issue84-windows-x86_64-${{ github.sha }}
          path: build/tests/bin/
          if-no-files-found: error
          retention-days: 14
